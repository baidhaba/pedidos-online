<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazar Área 51 · Pedidos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{--ink:#17161a;--paper:#FBFAF6;--orange:#e8590c;--line:#e9e2d4;}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  img{display:block;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}

  header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;}
  .hin{max-width:1100px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{height:38px;width:38px;border-radius:9px;object-fit:cover;box-shadow:0 3px 10px rgba(0,0,0,.3);}
  .brand b{font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:-.4px;display:block;line-height:1;}
  .brand span{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.2em;}
  .cartbtn{position:relative;display:none;align-items:center;gap:7px;background:var(--orange);color:#fff;font-weight:800;font-size:14px;padding:9px 14px;border-radius:10px;}
  .cartbtn .b{position:absolute;top:-7px;right:-7px;background:#fff;color:var(--orange);font-size:10px;font-weight:900;min-width:19px;height:19px;padding:0 5px;border-radius:99px;display:flex;align-items:center;justify-content:center;}

  .hero{max-width:1100px;margin:0 auto;padding:30px 16px 6px;}
  .hero h1{font-weight:900;text-transform:uppercase;letter-spacing:-1.5px;line-height:.92;font-size:34px;}
  .hero h1 span{display:block;color:var(--orange);}
  .hero p{margin-top:10px;font-size:14px;color:rgba(23,22,26,.6);max-width:440px;}

  .controls{max-width:1100px;margin:0 auto;padding:16px 16px 0;}
  .search{position:relative;margin-bottom:12px;}
  .search input{width:100%;background:#fff;border:1px solid #e5ded0;border-radius:12px;padding:11px 12px 11px 38px;font-size:14px;outline:none;}
  .search input:focus{border-color:var(--orange);}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(23,22,26,.4);}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .chip{white-space:nowrap;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:8px 14px;border-radius:99px;border:1px solid #e5ded0;background:#fff;color:rgba(23,22,26,.7);}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .count{font-size:11px;color:rgba(23,22,26,.4);margin-top:8px;}

  .main{max-width:1100px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
  .thumb{height:120px;position:relative;user-select:none;background:#f4efe6;}
  .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .thumb .ph img{width:44px;height:44px;opacity:.22;border-radius:8px;box-shadow:none;}
  .thumb .real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .zoom{position:absolute;bottom:8px;right:8px;background:rgba(255,255,255,.92);border-radius:99px;padding:5px;display:flex;box-shadow:0 1px 4px rgba(0,0,0,.2);}
  .thumb.noimg .zoom{display:none;}
  .cbody{padding:11px 12px 12px;display:flex;flex-direction:column;flex:1;}
  .ccode{font-family:ui-monospace,monospace;font-size:10px;color:rgba(23,22,26,.4);}
  .cname{font-size:13px;font-weight:800;line-height:1.15;margin-top:2px;flex:1;text-transform:uppercase;}
  .crow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;}
  .cprice{font-weight:900;color:var(--orange);font-size:18px;letter-spacing:-.5px;}
  .addbtn{background:var(--ink);color:#fff;height:32px;min-width:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 8px;gap:4px;font-weight:800;font-size:13px;}
  .qtybtn{background:var(--ink);color:#fff;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:900;font-size:14px;}
  .qtybtn .u{font-size:10px;font-weight:700;opacity:.6;text-transform:uppercase;}

  aside{position:sticky;top:80px;}
  .cart{background:#fdfcf8;border:1px solid #e3dbc9;border-radius:16px;overflow:hidden;}
  .cart .top{background:var(--orange);color:#fff;font-weight:900;text-transform:uppercase;font-size:13px;letter-spacing:-.2px;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;}
  .cart .top .clear{color:#fff;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;opacity:.85;text-decoration:underline;text-underline-offset:2px;}
  .cart .body{padding:18px;}
  .empty{text-align:center;padding:26px 0;}
  .empty .circ{height:48px;width:48px;border-radius:99px;background:#f3ecdd;color:#c9a05a;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
  .empty b{font-size:14px;} .empty p{font-size:12px;color:rgba(23,22,26,.5);margin-top:4px;}
  .empty.sent .circ{background:#e7f7ec;color:#16a34a;}
  .li{display:flex;gap:8px;margin-bottom:12px;}
  .li .info{flex:1;}
  .li .nm{font-size:13px;font-weight:800;line-height:1.15;}
  .li .pu{font-size:11px;color:rgba(23,22,26,.5);margin-top:2px;}
  .li .st{display:flex;align-items:center;gap:2px;background:var(--ink);border-radius:8px;padding:2px;width:fit-content;margin-top:6px;}
  .li .st button{color:#fff;height:24px;width:24px;display:flex;align-items:center;justify-content:center;}
  .li .st .num{color:#fff;font-weight:900;font-size:12px;min-width:22px;text-align:center;text-decoration:underline dotted rgba(255,255,255,.4);text-underline-offset:2px;}
  .li .rt{text-align:right;}
  .li .rt .tot{font-weight:900;letter-spacing:-.3px;}
  .li .rt .del{color:rgba(23,22,26,.3);margin-top:4px;}
  .li .rt .del:hover{color:#dc2626;}
  .sep{height:1px;margin:16px 0;background-image:repeating-linear-gradient(90deg,#c9c0ad 0 8px,transparent 8px 16px);}
  .totrow{display:flex;justify-content:space-between;align-items:baseline;}
  .totrow .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:rgba(23,22,26,.5);}
  .totrow .v{font-weight:900;font-size:26px;color:var(--orange);letter-spacing:-1px;}
  .fields{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
  .fields input,.fields textarea{width:100%;background:#fff;border:1px solid #e3dbc9;border-radius:9px;padding:9px 12px;font-size:13px;outline:none;font-family:inherit;resize:none;}
  .fields input:focus,.fields textarea:focus{border-color:var(--orange);}
  .send{margin-top:12px;width:100%;background:#16a34a;color:#fff;font-weight:800;font-size:14px;padding:13px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;}
  .send:active{transform:scale(.98);}
  .sendhint{font-size:10px;color:rgba(23,22,26,.4);text-align:center;margin-top:8px;line-height:1.4;}

  .bottombar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--ink);color:#fff;padding:12px 16px;align-items:center;justify-content:space-between;}
  .bottombar .lbl{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.15em;}
  .bottombar .tt{font-weight:900;font-size:20px;}
  .bottombar button{background:var(--orange);color:#fff;font-weight:800;font-size:14px;padding:10px 20px;border-radius:12px;}

  .pkwrap{position:fixed;inset:0;z-index:55;display:flex;align-items:flex-end;justify-content:center;}
  .pkwrap .bg{position:absolute;inset:0;background:rgba(0,0,0,.6);}
  .pkpanel{position:relative;width:100%;max-width:440px;max-height:94vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px 22px;box-shadow:0 -12px 40px rgba(0,0,0,.28);}
  .pkhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px;}
  .pkname{font-size:14px;font-weight:800;line-height:1.15;}
  .pkprice{font-size:12px;color:var(--orange);font-weight:900;margin-top:2px;}
  .pkx{color:rgba(23,22,26,.4);flex:none;}
  .qadjust{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;}
  .qadjust .rb{height:52px;width:52px;border-radius:99px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
  .qadjust .rb:active{transform:scale(.92);}
  .qbig{min-width:96px;text-align:center;}
  .qbig b{font-weight:900;font-size:44px;letter-spacing:-2px;line-height:1;}
  .qbig span{display:block;font-size:10px;color:rgba(23,22,26,.45);font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-top:2px;}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .keys button{background:#f4efe4;border-radius:12px;padding:15px 0;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .keys button:active{transform:scale(.95);}
  .kconfirm{margin-top:16px;width:100%;background:var(--orange);color:#fff;font-weight:800;padding:14px;border-radius:12px;font-size:14px;}

  .lightbox{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:16px;}
  .lightbox .bg{position:absolute;inset:0;background:rgba(0,0,0,.8);}
  .lightbox .lb{position:relative;max-width:460px;width:100%;}
  .lightbox img.big{width:100%;border-radius:16px;background:#fff;object-fit:contain;max-height:74vh;}
  .lightbox .close{position:absolute;top:-14px;right:-10px;background:#fff;border-radius:99px;padding:8px;box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:2;}
  .lightbox .lcap{text-align:center;color:#fff;margin-top:12px;}
  .lightbox .lcap b{font-size:14px;} .lightbox .lcap .p{font-weight:900;font-size:20px;color:#ff7a3d;}

  .sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;}
  .sheetwrap .bg{position:absolute;inset:0;background:rgba(0,0,0,.5);}
  .sheetpanel{position:relative;width:100%;max-height:88vh;overflow:auto;}
  .sheetpanel .xrow{display:flex;justify-content:flex-end;padding:8px;}
  .sheetpanel .xrow button{background:#fff;border-radius:99px;padding:8px;box-shadow:0 3px 10px rgba(0,0,0,.2);}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#16a34a;color:#fff;font-weight:800;font-size:14px;padding:12px 20px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}


  .card.nostock .thumb .real{filter:grayscale(1) opacity(.55);}
  .card.nostock .thumb .ph img{filter:grayscale(1);}
  .nostock-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);background:rgba(23,22,26,.82);color:#fff;font-weight:900;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:5px 14px;border-radius:6px;white-space:nowrap;}
  .cprice.consultar{font-size:11px;font-weight:800;color:rgba(23,22,26,.45);text-transform:uppercase;letter-spacing:.03em;line-height:1.2;max-width:110px;}
  @media(min-width:768px){ .pkwrap{align-items:center;} .pkpanel{border-radius:22px;} }
  @media(max-width:1023px){
    .cartbtn{display:flex;} aside{display:none;} .main{grid-template-columns:1fr;} .bottombar.show{display:flex;}
    .hero h1{font-size:30px;} body{padding-bottom:70px;}
  }
  @media(max-width:420px){ .grid{grid-template-columns:repeat(2,1fr);} }

  /* Cartel: cambió el catálogo */
  .rvwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  .rvwrap .bg{position:absolute;inset:0;background:rgba(0,0,0,.6);}
  .rvpanel{position:relative;width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px 22px;box-shadow:0 -12px 40px rgba(0,0,0,.28);}
  .rvhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;}
  .rvic{flex:none;width:40px;height:40px;border-radius:11px;background:#fff4e8;color:var(--orange);display:flex;align-items:center;justify-content:center;}
  .rvtitle{font-weight:900;font-size:17px;letter-spacing:-.3px;}
  .rvsub{font-size:12.5px;color:rgba(23,22,26,.6);margin-top:2px;line-height:1.35;}
  .rvlist{border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .rvrow{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);}
  .rvrow:last-child{border-bottom:none;}
  .rvdot{flex:none;width:8px;height:8px;border-radius:99px;background:var(--orange);margin-top:6px;}
  .rvtxt{font-size:13.5px;line-height:1.4;}
  .rvtxt b{font-weight:800;}
  .rvtxt span{display:block;color:rgba(23,22,26,.7);font-size:13px;margin-top:1px;}
  .rvbtn{margin-top:16px;width:100%;background:var(--orange);color:#fff;font-weight:800;padding:15px;border-radius:12px;font-size:15px;}
  .rvcancel{margin-top:8px;width:100%;background:transparent;color:rgba(23,22,26,.55);font-weight:700;padding:10px;font-size:13.5px;}
  @media(min-width:768px){ .rvwrap{align-items:center;} .rvpanel{border-radius:22px;} }

  /* Cortina de mantenimiento */
  .curtain{display:none;}
  body.paused .hero,body.paused .controls,body.paused .main,body.paused .bottombar,body.paused .cartbtn{display:none!important;}
  body.paused{padding-bottom:0!important;}
  body.paused .curtain{display:flex;align-items:center;justify-content:center;min-height:72vh;padding:40px 22px;text-align:center;}
  .curtain-in{max-width:380px;}
  .curtain-ic{width:78px;height:78px;border-radius:99px;background:#fff4e8;color:var(--orange);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
  .curtain h2{font-size:26px;font-weight:900;letter-spacing:-.6px;}
  .curtain p{font-size:15px;color:rgba(23,22,26,.6);margin-top:8px;}
</style>
</head>

function fmt(n){return Number(n).toLocaleString("es-AR",{maximumFractionDigits:0});}
function photoSrc(img){return FOTOS+encodeURIComponent(img);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// Codificación segura para URL (base64 que soporta acentos)
function encodePedido(obj){
  const json=JSON.stringify(obj);
  const b64=btoa(unescape(encodeURIComponent(json)));
  return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
// Número de pedido: P-AAMMDD-HHMM-XXX
function nuevoNumero(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  const fecha=String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate());
  const hora=p(d.getHours())+p(d.getMinutes());
  const rnd=Array.from({length:3},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join('');
  return `P-${fecha}-${hora}-${rnd}`;
}

let state={cart:{},cat:"Todos",query:"",name:"",note:"",pickerId:null,pickerVal:"",pickerFresh:true,photo:null,sheet:false,sent:false,review:null,checking:false};
const cats=["Todos"];

function visibleProducts(){
  const q=state.query.trim().toLowerCase();
  return PRODUCTS.filter(p=>{
    const okCat=state.cat==="Todos"||p.category===state.cat;
    const okQ=!q||p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q);
    return okCat&&okQ;
  });
}
function lines(){return Object.keys(state.cart).map(id=>{const p=PRODUCTS.find(x=>x.id===id);return{...p,qty:state.cart[id],total:p.price*state.cart[id]};});}
function subtotal(){return lines().reduce((a,b)=>a+(sinStock(b)?0:b.total),0);}
function count(){return lines().reduce((a,b)=>a+b.qty,0);}
function setQty(id,q){if(q>0)state.cart[id]=q;else delete state.cart[id];}
function sinStock(p){return p.sinStock===true;}

function construirPedido(){
  const ls=lines();
  const numero=nuevoNumero();
  return {
    numero, fecha:new Date().toISOString(),
    cliente:state.name.trim(), nota:state.note.trim(),
    total:subtotal(),
    items:ls.map(l=>({c:l.code,d:l.name,q:l.qty,u:sinStock(l)?0:l.price,t:sinStock(l)?0:l.total,sinStock:sinStock(l)||undefined}))
  };
}
function waHref(pedido){
  const ls=lines();
  if(ls.length===0) return "#";
  const link=BASE_URL+"pedido.html#"+encodePedido(pedido);
  let t=`*NUEVO PEDIDO — BAZAR ÁREA 51*\n`;
  t+=`N° ${pedido.numero}\n`;
  if(pedido.cliente) t+=`Cliente: ${pedido.cliente}\n`;
  t+=`——————————————\n`;
  ls.forEach(l=>{ if(sinStock(l)){ t+=`${l.qty} x ${l.name} (sin stock)\na consultar\n`; } else { t+=`${l.qty} x ${l.name}\n$${fmt(l.price)} c/u  =  $${fmt(l.total)}\n`; } });
  t+=`——————————————\n*TOTAL: $${fmt(pedido.total)}*\n`;
  if(pedido.nota) t+=`\nNota: ${pedido.nota}\n`;
  t+=`\n— Para cargar en la PC, abrí este link:\n${link}\n`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(t)}`;
}
// ——— Verificación del catálogo al enviar ———
function idxById(arr){const m={};arr.forEach(p=>{m[p.id]=p;});return m;}
function difItem(cur,fresh){
  if(!fresh) return null; // producto que se sacó del catálogo: no dispara aviso (por decisión)
  const curOut=cur.sinStock===true, freshOut=fresh.sinStock===true;
  if(!curOut && freshOut) return {tipo:'sinstock', name:cur.name};
  if(curOut && !freshOut) return {tipo:'restock', name:cur.name, price:fresh.price};
  if(!curOut && !freshOut && Number(cur.price)!==Number(fresh.price)) return {tipo:'precio', name:cur.name, de:cur.price, a:fresh.price};
  return null;
}
async function intentarEnviar(){
  if(state.checking) return;
  if(lines().length===0) return;
  state.checking=true; showToast('Verificando precios…');
  let fresh=null;
  try{
    const r=await fetch('catalogo.json?_='+Date.now(),{cache:'no-store'});
    if(r.ok) fresh=await r.json();
  }catch(e){ fresh=null; }
  state.checking=false;
  if(!fresh){ enviarPedido(); return; } // sin internet: no bloqueo la venta
  const fm=idxById(fresh);
  const cambios=[];
  lines().forEach(l=>{ const d=difItem(l,fm[l.id]); if(d) cambios.push(d); });
  if(cambios.length===0){ enviarPedido(); return; }
  state.review={cambios,fresh:fm}; renderModals();
}
function aplicarCambiosYEnviar(){
  const fm=state.review?state.review.fresh:null;
  if(fm){ PRODUCTS.forEach(p=>{ const f=fm[p.id]; if(f){ p.price=f.price; p.sinStock=(f.sinStock===true); } }); }
  state.review=null;
  enviarPedido();
}
function enviarPedido(){
  if(lines().length===0){ state.review=null; renderAll(); return; }
  const pedido=construirPedido();
  const u=waHref(pedido);
  const w=window.open(u,'_blank'); if(!w) location.href=u;
  state.cart={};state.name='';state.note='';state.sheet=false;state.sent=true;state.review=null;
  renderAll(); showToast('¡Pedido '+pedido.numero+' enviado! ✓');
}

function renderCart(){
  document.getElementById('cartAside').innerHTML=cartHTML();
  const c=count();
  const cc=document.getElementById('cartCount');
  cc.style.display=c>0?'flex':'none'; cc.textContent=c;
  const bb=document.getElementById('bottombar');
  bb.classList.toggle('show',c>0);
  document.getElementById('bbCount').textContent=c;
  document.getElementById('bbTotal').textContent='$'+fmt(subtotal());
}
function renderModals(){
  const m=document.getElementById('modals');
  let h='';
  if(state.pickerId){
    const p=PRODUCTS.find(x=>x.id===state.pickerId);
    const val=state.pickerVal||"0";
    const q=parseInt(state.pickerVal||"0",10)||0;
    const keys=["1","2","3","4","5","6","7","8","9"].map(k=>`<button data-act="pkey" data-k="${k}">${k}</button>`).join('');
    h+=`<div class="pkwrap"><div class="bg" data-act="closepicker"></div><div class="pkpanel">`+
       `<div class="pkhead"><div><div class="pkname">${esc(p.name)}</div><div class="pkprice">${sinStock(p)?"Sin stock · a consultar":("$"+fmt(p.price)+" c/u")}</div></div><button class="pkx" data-act="closepicker"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`+
       `<div class="qadjust"><button class="rb" data-act="pminus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12h14"/></svg></button><div class="qbig"><b>${val}</b><span>unidades</span></div><button class="rb" data-act="pplus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg></button></div>`+
       `<div class="keys">${keys}<button data-act="pclear">C</button><button data-act="pkey" data-k="0">0</button><button data-act="pback"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2ZM18 9l-6 6M12 9l6 6"/></svg></button></div>`+
       `<button class="kconfirm" data-act="pconfirm">${q>0?('Poner '+q+' en el pedido'):'Quitar del pedido'}</button>`+
       `</div></div>`;
  }
  if(state.photo){
    const p=state.photo;
    h+=`<div class="lightbox"><div class="bg" data-act="closephoto"></div><div class="lb"><button class="close" data-act="closephoto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button><img class="big" src="${photoSrc(p.img)}" alt="${esc(p.name)}" onerror="this.style.display='none'"><div class="lcap"><b>${esc(p.name)}</b><div class="p">$${fmt(p.price)}</div></div></div></div>`;
  }
  if(state.sheet){
    h+=`<div class="sheetwrap"><div class="bg" data-act="closesheet"></div><div class="sheetpanel"><div class="xrow"><button data-act="closesheet"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161a" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div style="padding:0 12px 16px">${cartHTML()}</div></div></div>`;
  }
  if(state.review){
    const rows=state.review.cambios.map(c=>{
      let msg;
      if(c.tipo==='precio') msg=`<b>${esc(c.name)}</b><span>cambió de $${fmt(c.de)} a <b>$${fmt(c.a)}</b></span>`;
      else if(c.tipo==='sinstock') msg=`<b>${esc(c.name)}</b><span>quedó sin stock — pasa a <b>consultar disponibilidad</b></span>`;
      else msg=`<b>${esc(c.name)}</b><span>volvió a estar disponible — <b>$${fmt(c.price)}</b></span>`;
      return `<div class="rvrow"><span class="rvdot"></span><div class="rvtxt">${msg}</div></div>`;
    }).join('');
    h+=`<div class="rvwrap"><div class="bg" data-act="closereview"></div><div class="rvpanel">`+
       `<div class="rvhead"><div class="rvic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div><div><div class="rvtitle">Cambió el catálogo</div><div class="rvsub">Actualizamos tu pedido con los precios y el stock de ahora antes de enviarlo.</div></div></div>`+
       `<div class="rvlist">${rows}</div>`+
       `<button class="rvbtn" data-act="applysend">Actualizar y enviar</button>`+
       `<button class="rvcancel" data-act="closereview">Cancelar</button>`+
       `</div></div>`;
  }
  m.innerHTML=h;
}
function renderAll(){renderGrid();renderCart();renderModals();}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),3500);}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t) return;
  const act=t.dataset.act, id=t.dataset.id;
  if(act==='add'){state.sent=false;state.cart[id]=(state.cart[id]||0)+1;renderAll();}
  else if(act==='sub'){const q=(state.cart[id]||0)-1;if(q<=0)delete state.cart[id];else state.cart[id]=q;renderAll();}
  else if(act==='del'){delete state.cart[id];renderAll();}
  else if(act==='clearcart'){state.cart={};renderAll();}
  else if(act==='cat'){state.cat=t.dataset.v;renderChips();renderGrid();}
  else if(act==='picker'){state.sent=false;state.pickerId=id;const cur=state.cart[id]||0;state.pickerVal=cur>0?String(cur):"1";state.pickerFresh=true;renderModals();}
  else if(act==='pkey'){if(state.pickerFresh){state.pickerVal=t.dataset.k;state.pickerFresh=false;}else if(state.pickerVal.length<4){state.pickerVal+=t.dataset.k;}renderModals();}
  else if(act==='pclear'){state.pickerVal="0";state.pickerFresh=true;renderModals();}
  else if(act==='pback'){state.pickerVal=state.pickerVal.slice(0,-1);renderModals();}
  else if(act==='pplus'){state.pickerVal=String((parseInt(state.pickerVal||"0",10)||0)+1);state.pickerFresh=true;renderModals();}
  else if(act==='pminus'){state.pickerVal=String(Math.max(0,(parseInt(state.pickerVal||"0",10)||0)-1));state.pickerFresh=true;renderModals();}
  else if(act==='pconfirm'){const q=parseInt(state.pickerVal||"0",10)||0;setQty(state.pickerId,q);state.pickerId=null;renderAll();}
  else if(act==='closepicker'){state.pickerId=null;renderModals();}
  else if(act==='photo'){const p=PRODUCTS.find(x=>x.id===id);state.photo=p;renderModals();}
  else if(act==='closephoto'){state.photo=null;renderModals();}
  else if(act==='opensheet'){state.sheet=true;renderModals();}
  else if(act==='closesheet'){state.sheet=false;renderModals();}
  else if(act==='send'){ e.preventDefault(); intentarEnviar(); }
  else if(act==='applysend'){ aplicarCambiosYEnviar(); }
  else if(act==='closereview'){ state.review=null; state.checking=false; renderModals(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='search'){state.query=e.target.value;renderGrid();}
  else if(e.target.id==='fName'){state.name=e.target.value;}
  else if(e.target.id==='fNote'){state.note=e.target.value;}
});

async function cargarCatalogo(){
  try{
    const r=await fetch('catalogo.json',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    PRODUCTS=await r.json();
  }catch(e){
    document.getElementById('grid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:50px 16px;color:#b91c1c"><b>No se pudo cargar el catálogo.</b><br><span style="font-size:13px;color:rgba(23,22,26,.55)">Revisá que <b>catalogo.json</b> esté subido junto al index.</span></div>';
    return;
  }
  cats.length=0; cats.push("Todos",...Array.from(new Set(PRODUCTS.map(p=>p.category))).sort());
  renderChips(); renderAll();
}
async function estaAbierto(){
  try{
    const r=await fetch('estado.json?_='+Date.now(),{cache:'no-store'});
    if(!r.ok) return true;            // si no existe o falla, la web queda abierta
    const e=await r.json();
    return e.abierto!==false;         // solo cierra si dice explícitamente false
  }catch(_){ return true; }           // ante cualquier error, abierta (nunca se traba sola)
}
async function iniciar(){
  const abierto=await estaAbierto();
  if(!abierto){ document.body.classList.add('paused'); return; }
  cargarCatalogo();
}
iniciar();
</script>
</body>
