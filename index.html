<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazar Área 51 · Pedidos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{--ink:#17161a;--paper:#FBFAF6;--orange:#e8590c;--line:#e9e2d4;}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  img{display:block;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  .disp{font-family:'Archivo',sans-serif;font-weight:900;}

  header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;}
  .hin{max-width:1100px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{height:38px;width:38px;border-radius:9px;object-fit:cover;box-shadow:0 3px 10px rgba(0,0,0,.3);}
  .brand b{font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:-.4px;display:block;line-height:1;}
  .brand span{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.2em;}
  .cartbtn{position:relative;display:none;align-items:center;gap:7px;background:var(--orange);color:#fff;font-weight:800;font-size:14px;padding:9px 14px;border-radius:10px;}
  .cartbtn .b{position:absolute;top:-7px;right:-7px;background:#fff;color:var(--orange);font-size:10px;font-weight:900;min-width:19px;height:19px;padding:0 5px;border-radius:99px;display:flex;align-items:center;justify-content:center;}

  .hero{max-width:1100px;margin:0 auto;padding:30px 16px 6px;}
  .hero h1{font-weight:900;text-transform:uppercase;letter-spacing:-1.5px;line-height:.92;font-size:34px;}
  .hero h1 span{display:block;color:var(--orange);}
  .hero p{margin-top:10px;font-size:14px;color:rgba(23,22,26,.6);max-width:440px;}

  .controls{max-width:1100px;margin:0 auto;padding:16px 16px 0;}
  .search{position:relative;margin-bottom:12px;}
  .search input{width:100%;background:#fff;border:1px solid #e5ded0;border-radius:12px;padding:11px 12px 11px 38px;font-size:14px;outline:none;}
  .search input:focus{border-color:var(--orange);}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(23,22,26,.4);}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
  .chip{white-space:nowrap;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:8px 14px;border-radius:99px;border:1px solid #e5ded0;background:#fff;color:rgba(23,22,26,.7);}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .count{font-size:11px;color:rgba(23,22,26,.4);margin-top:8px;}

  .main{max-width:1100px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
  .thumb{height:112px;position:relative;user-select:none;}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .tag{position:absolute;top:8px;left:8px;font-size:9px;font-weight:800;color:rgba(255,255,255,.9);background:rgba(0,0,0,.3);padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.08em;}
  .outtag{position:absolute;top:8px;right:8px;font-size:9px;font-weight:900;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:5px;text-transform:uppercase;}
  .zoom{position:absolute;bottom:8px;right:8px;background:rgba(255,255,255,.92);border-radius:99px;padding:5px;display:flex;box-shadow:0 1px 4px rgba(0,0,0,.2);}
  .cbody{padding:11px 12px 12px;display:flex;flex-direction:column;flex:1;}
  .ccode{font-family:ui-monospace,monospace;font-size:10px;color:rgba(23,22,26,.4);}
  .cname{font-size:13px;font-weight:800;line-height:1.15;margin-top:2px;flex:1;text-transform:uppercase;}
  .crow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
  .cprice{font-weight:900;color:var(--orange);font-size:18px;letter-spacing:-.5px;}
  .addbtn{background:var(--ink);color:#fff;height:32px;width:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .step{display:flex;align-items:center;gap:2px;background:var(--ink);border-radius:9px;padding:2px;}
  .step button{color:#fff;height:28px;width:28px;display:flex;align-items:center;justify-content:center;}
  .step .num{color:#fff;font-weight:900;font-size:14px;min-width:26px;text-align:center;text-decoration:underline dotted rgba(255,255,255,.4);text-underline-offset:3px;}

  aside{position:sticky;top:80px;}
  .cart{background:#fdfcf8;border:1px solid #e3dbc9;border-radius:16px;overflow:hidden;}
  .cart .top{background:var(--orange);color:#fff;font-weight:900;text-transform:uppercase;font-size:13px;letter-spacing:-.2px;padding:11px 18px;}
  .cart .body{padding:18px;}
  .empty{text-align:center;padding:26px 0;}
  .empty .circ{height:48px;width:48px;border-radius:99px;background:#f3ecdd;color:#c9a05a;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
  .empty b{font-size:14px;} .empty p{font-size:12px;color:rgba(23,22,26,.5);margin-top:4px;}
  .li{display:flex;gap:8px;margin-bottom:12px;}
  .li .info{flex:1;}
  .li .nm{font-size:13px;font-weight:800;line-height:1.15;}
  .li .pu{font-size:11px;color:rgba(23,22,26,.5);margin-top:2px;}
  .li .st{display:flex;align-items:center;gap:2px;background:var(--ink);border-radius:8px;padding:2px;width:fit-content;margin-top:6px;}
  .li .st button{color:#fff;height:24px;width:24px;display:flex;align-items:center;justify-content:center;}
  .li .st .num{color:#fff;font-weight:900;font-size:12px;min-width:22px;text-align:center;text-decoration:underline dotted rgba(255,255,255,.4);text-underline-offset:2px;}
  .li .rt{text-align:right;}
  .li .rt .tot{font-weight:900;letter-spacing:-.3px;}
  .li .rt .del{color:rgba(23,22,26,.3);margin-top:4px;}
  .sep{height:1px;margin:16px 0;background-image:repeating-linear-gradient(90deg,#c9c0ad 0 8px,transparent 8px 16px);}
  .totrow{display:flex;justify-content:space-between;align-items:baseline;}
  .totrow .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:rgba(23,22,26,.5);}
  .totrow .v{font-weight:900;font-size:26px;color:var(--orange);letter-spacing:-1px;}
  .fields{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
  .fields input,.fields textarea{width:100%;background:#fff;border:1px solid #e3dbc9;border-radius:9px;padding:9px 12px;font-size:13px;outline:none;font-family:inherit;resize:none;}
  .fields input:focus,.fields textarea:focus{border-color:var(--orange);}
  .send{margin-top:12px;width:100%;background:#16a34a;color:#fff;font-weight:800;font-size:14px;padding:13px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;}
  .send:active{transform:scale(.98);}
  .sendhint{font-size:10px;color:rgba(23,22,26,.4);text-align:center;margin-top:8px;line-height:1.4;}

  .bottombar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--ink);color:#fff;padding:12px 16px;align-items:center;justify-content:space-between;}
  .bottombar .lbl{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.15em;}
  .bottombar .tt{font-weight:900;font-size:20px;}
  .bottombar button{background:var(--orange);color:#fff;font-weight:800;font-size:14px;padding:10px 20px;border-radius:12px;}

  .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
  .overlay .bg{position:absolute;inset:0;background:rgba(0,0,0,.6);}
  .modal{position:relative;background:#fff;border-radius:24px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:100%;max-width:320px;}
  .modal .mh{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .modal .mh .mn{font-size:14px;font-weight:800;line-height:1.15;}
  .modal .mh button{color:rgba(23,22,26,.4);flex:none;}
  .disp-num{background:var(--paper);border:1px solid #e5ded0;border-radius:12px;padding:16px;text-align:center;margin-bottom:16px;}
  .disp-num b{font-weight:900;font-size:38px;letter-spacing:-1px;}
  .disp-num span{font-size:12px;color:rgba(23,22,26,.45);margin-left:6px;font-weight:800;text-transform:uppercase;}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .keys button{background:#f4efe4;border-radius:12px;padding:15px 0;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .keys button:active{transform:scale(.95);}
  .kconfirm{margin-top:16px;width:100%;background:var(--orange);color:#fff;font-weight:800;padding:13px;border-radius:12px;font-size:14px;}

  .lightbox .lb{position:relative;max-width:460px;width:100%;}
  .lightbox img{width:100%;border-radius:16px;background:#fff;object-fit:contain;max-height:74vh;}
  .lightbox .close{position:absolute;top:-14px;right:-10px;background:#fff;border-radius:99px;padding:8px;box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:2;}
  .lightbox .lcap{text-align:center;color:#fff;margin-top:12px;}
  .lightbox .lcap b{font-size:14px;} .lightbox .lcap .p{font-weight:900;font-size:20px;color:#ff7a3d;}

  @media(max-width:1023px){
    .cartbtn{display:flex;} aside{display:none;} .main{grid-template-columns:1fr;} .bottombar.show{display:flex;}
    .hero h1{font-size:30px;} body{padding-bottom:70px;}
    .sheet aside{display:block;position:static;} 
  }
  @media(max-width:420px){ .grid{grid-template-columns:repeat(2,1fr);} }
</style>
</head>

const FOTOS = "fotos/";
const WHATSAPP_NUMBER = "5492213634601";
const PRODUCTS = JSON.parse(document.getElementById('catalog-data').textContent);

const PALETTE=["#e8590c","#b45309","#a16207","#0f766e","#15803d","#4d7c0f","#7c3aed","#9333ea","#a21caf","#0369a1","#0891b2","#2563eb","#be123c","#c2410c","#4338ca","#0d9488","#7e22ce","#b91c1c","#1d4ed8"];
function catColor(c){let h=0;for(let i=0;i<c.length;i++)h=(h*31+c.charCodeAt(i))%PALETTE.length;return PALETTE[h];}
function fmt(n){return Number(n).toLocaleString("es-AR",{maximumFractionDigits:0});}
function isOut(p){return p.sinStock||p.stock<=0;}
function photoSrc(img){return EMBEDDED[img]||(FOTOS+encodeURIComponent(img));}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

let state={cart:{},cat:"Todos",query:"",name:"",note:"",keypadId:null,keypadVal:"",photo:null,sheet:false};

const cats=["Todos",...Array.from(new Set(PRODUCTS.map(p=>p.category))).sort()];

function visibleProducts(){
  const q=state.query.trim().toLowerCase();
  return PRODUCTS.filter(p=>{
    const okCat=state.cat==="Todos"||p.category===state.cat;
    const okQ=!q||p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q);
    return okCat&&okQ;
  });
}
function lines(){return Object.keys(state.cart).map(id=>{const p=PRODUCTS.find(x=>x.id===id);return{...p,qty:state.cart[id],total:p.price*state.cart[id]};});}
function subtotal(){return lines().reduce((a,b)=>a+b.total,0);}
function count(){return lines().reduce((a,b)=>a+b.qty,0);}

function renderChips(){
  document.getElementById('chips').innerHTML=cats.map(c=>
    `<button class="chip ${c===state.cat?'on':''}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('');
}
function cardHTML(p){
  const qty=state.cart[p.id]||0;
  const out=isOut(p);
  const hasImg=!!p.img;
  const showImg=hasImg;
  const thumbBg=showImg?'#f1ece0':catColor(p.category);
  let inner=`<div class="thumb" style="background:${thumbBg}" ${hasImg?`data-act="photo" data-id="${p.id}"`:''}>`;
  if(showImg) inner+=`<img src="${photoSrc(p.img)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">`;
  inner+=`<span class="tag">${esc(p.category)}</span>`;
  if(out) inner+=`<span class="outtag">Sin stock</span>`;
  if(hasImg) inner+=`<span class="zoom"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#17161a" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg></span>`;
  inner+=`</div>`;
  let ctrl;
  if(qty===0){
    ctrl=`<button class="addbtn" data-act="add" data-id="${p.id}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>`;
  }else{
    ctrl=`<div class="step"><button data-act="sub" data-id="${p.id}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14"/></svg></button><button class="num" data-act="keypad" data-id="${p.id}">${qty}</button><button data-act="add" data-id="${p.id}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button></div>`;
  }
  return `<div class="card">${inner}<div class="cbody"><div class="ccode">${esc(p.code)}</div><div class="cname">${esc(p.name)}</div><div class="crow"><div class="cprice">$${fmt(p.price)}</div>${ctrl}</div></div></div>`;
}
function renderGrid(){
  const vis=visibleProducts();
  document.getElementById('count').textContent=vis.length+" productos · tocá la foto para verla grande";
  const g=document.getElementById('grid');
  if(vis.length===0){g.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:rgba(23,22,26,.4)"><b>No hay productos con ese filtro.</b><br><span style="font-size:13px">Probá con otra categoría o borrá la búsqueda.</span></div>`;return;}
  g.innerHTML=vis.map(cardHTML).join('');
}

  let body='';
  ls.forEach(l=>{
    body+=`<div class="li"><div class="info"><div class="nm">${esc(l.name)}</div><div class="pu">$${fmt(l.price)} c/u</div><div class="st"><button data-act="sub" data-id="${l.id}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14"/></svg></button><button class="num" data-act="keypad" data-id="${l.id}">${l.qty}</button><button data-act="add" data-id="${l.id}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button></div></div><div class="rt"><div class="tot">$${fmt(l.total)}</div><button class="del" data-act="del" data-id="${l.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button></div></div>`;
  });
  const wa=waHref();
  return `<div class="cart"><div class="top">Nota de pedido</div><div class="body">${body}<div class="sep"></div><div class="totrow"><span class="k">Total</span><span class="v">$${fmt(subtotal())}</span></div><div class="fields"><input id="fName" placeholder="Tu nombre (opcional)" value="${esc(state.name)}"><textarea id="fNote" rows="2" placeholder="Aclaración o dirección (opcional)">${esc(state.note)}</textarea></div><a class="send" href="${wa}" target="_blank" rel="noopener"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg>Enviar pedido por WhatsApp</a><div class="sendhint">Se abre WhatsApp con el pedido ya escrito. Solo tenés que apretar enviar.</div></div></div>`;
}
function waHref(){
  const ls=lines();
  if(ls.length===0) return "#";
  let t=`*NUEVO PEDIDO — BAZAR ÁREA 51*\n`;
  if(state.name.trim()) t+=`Cliente: ${state.name.trim()}\n`;
  t+=`——————————————\n`;
  ls.forEach(l=>{t+=`${l.qty} x ${l.name}\n$${fmt(l.price)} c/u  =  $${fmt(l.total)}\n`;});
  t+=`——————————————\n*TOTAL: $${fmt(subtotal())}*\n`;
  if(state.note.trim()) t+=`\nNota: ${state.note.trim()}\n`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(t)}`;
}
function renderCart(){
  document.getElementById('cartAside').innerHTML=cartHTML();
  const c=count();
  const cc=document.getElementById('cartCount');
  cc.style.display=c>0?'flex':'none'; cc.textContent=c;
  const bb=document.getElementById('bottombar');
  bb.classList.toggle('show',c>0);
  document.getElementById('bbCount').textContent=c;
  document.getElementById('bbTotal').textContent='$'+fmt(subtotal());
}
function renderModals(){
  const m=document.getElementById('modals');
  let h='';
  if(state.keypadId){
    const p=PRODUCTS.find(x=>x.id===state.keypadId);
    const val=state.keypadVal||"0";
    const q=parseInt(state.keypadVal||"0",10)||0;
    const keys=["1","2","3","4","5","6","7","8","9"].map(k=>`<button data-act="key" data-k="${k}">${k}</button>`).join('');
    h+=`<div class="overlay" data-act="closekeypad"><div class="bg"></div><div class="modal" onclick="event.stopPropagation()"><div class="mh"><div class="mn">${esc(p.name)}</div><button data-act="closekeypad"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="disp-num"><b>${val}</b><span>unid.</span></div><div class="keys">${keys}<button data-act="clearkey">C</button><button data-act="key" data-k="0">0</button><button data-act="backkey"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2ZM18 9l-6 6M12 9l6 6"/></svg></button></div><button class="kconfirm" data-act="confirmkey">${q>0?('Poner '+q+' en el pedido'):'Quitar del pedido'}</button></div></div>`;
  }
  if(state.photo){
    const p=state.photo;
    h+=`<div class="overlay lightbox" data-act="closephoto"><div class="bg"></div><div class="lb" onclick="event.stopPropagation()"><button class="close" data-act="closephoto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button><img src="${photoSrc(p.img)}" alt="${esc(p.name)}"><div class="lcap"><b>${esc(p.name)}</b><div class="p">$${fmt(p.price)}</div></div></div></div>`;
  }
  if(state.sheet){
    h+=`<div class="overlay sheet" data-act="closesheet" style="align-items:flex-end;padding:0"><div class="bg"></div><div style="position:relative;width:100%;max-height:88vh;overflow:auto" onclick="event.stopPropagation()"><div style="display:flex;justify-content:flex-end;padding:8px"><button data-act="closesheet" style="background:#fff;border-radius:99px;padding:8px;box-shadow:0 3px 10px rgba(0,0,0,.2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17161a" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div style="padding:0 12px 16px">${cartHTML()}</div></div></div>`;
  }
  m.innerHTML=h;
}
function renderAll(){renderGrid();renderCart();renderModals();}

// —— eventos ——
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t) return;
  const act=t.dataset.act, id=t.dataset.id;
  if(act==='add'){state.cart[id]=(state.cart[id]||0)+1;renderAll();}
  else if(act==='sub'){const q=(state.cart[id]||0)-1;if(q<=0)delete state.cart[id];else state.cart[id]=q;renderAll();}
  else if(act==='del'){delete state.cart[id];renderAll();}
  else if(act==='cat'){state.cat=t.dataset.v;renderChips();renderGrid();}
  else if(act==='keypad'){state.keypadId=id;state.keypadVal=String(state.cart[id]||"");renderModals();}
  else if(act==='key'){if(state.keypadVal.length<4)state.keypadVal+=t.dataset.k;renderModals();}
  else if(act==='clearkey'){state.keypadVal="";renderModals();}
  else if(act==='backkey'){state.keypadVal=state.keypadVal.slice(0,-1);renderModals();}
  else if(act==='confirmkey'){const q=parseInt(state.keypadVal||"0",10)||0;if(q>0)state.cart[state.keypadId]=q;else delete state.cart[state.keypadId];state.keypadId=null;renderAll();}
  else if(act==='closekeypad'){state.keypadId=null;renderModals();}
  else if(act==='photo'){const p=PRODUCTS.find(x=>x.id===id);state.photo=p;renderModals();}
  else if(act==='closephoto'){state.photo=null;renderModals();}
  else if(act==='opensheet'){state.sheet=true;renderModals();}
  else if(act==='closesheet'){state.sheet=false;renderModals();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='search'){state.query=e.target.value;renderGrid();}
  else if(e.target.id==='fName'){state.name=e.target.value;}
  else if(e.target.id==='fNote'){state.note=e.target.value;}
});

renderChips();renderAll();
</script>

</body>
</html>
