<head>
<meta charset="UTF-8">

<title>Pedido · Bazar Área 51</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--ink:#17161a;--paper:#FBFAF6;--orange:#e8590c;}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:20px;}
  .wrap{max-width:560px;margin:0 auto;}
  .hd{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .hd img{height:40px;width:40px;border-radius:9px;object-fit:cover;}
  .hd b{font-weight:900;text-transform:uppercase;font-size:18px;letter-spacing:-.4px;line-height:1;display:block;}
  .hd span{font-size:9px;color:rgba(23,22,26,.5);text-transform:uppercase;letter-spacing:.2em;}
  .card{background:#fff;border:1px solid #e6ddcb;border-radius:18px;overflow:hidden;}
  .top{background:var(--ink);color:#fff;padding:14px 18px;}
  .top .num{font-weight:900;font-size:20px;letter-spacing:-.5px;}
  .top .meta{font-size:11px;color:rgba(255,255,255,.6);margin-top:3px;}
  .body{padding:18px;}
  .cli{font-size:13px;margin-bottom:4px;} .cli b{font-weight:800;}
  .nota{font-size:12px;color:rgba(23,22,26,.7);background:#f6f1e6;border-radius:10px;padding:8px 12px;margin:8px 0 4px;}
  table{width:100%;border-collapse:collapse;margin-top:12px;}
  th,td{text-align:left;padding:8px 6px;font-size:13px;border-bottom:1px solid #eee6d5;}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(23,22,26,.5);font-weight:800;}
  td.q,td.u,td.t,th.q,th.u,th.t{text-align:right;white-space:nowrap;}
  .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:2px solid var(--ink);}
  .tot .k{font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.1em;}
  .tot .v{font-weight:900;font-size:24px;color:var(--orange);letter-spacing:-1px;}
  .dl{margin-top:18px;width:100%;background:var(--orange);color:#fff;font-weight:800;font-size:15px;padding:15px;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .dl:active{transform:scale(.99);}
  .hint{font-size:11px;color:rgba(23,22,26,.5);text-align:center;margin-top:10px;line-height:1.5;}
  .err{background:#fff;border:1px solid #f0c8c8;border-radius:16px;padding:30px 20px;text-align:center;}
  .err b{color:#b91c1c;font-size:16px;} .err p{font-size:13px;color:rgba(23,22,26,.6);margin-top:8px;}
</style>

<script>
function b64urlDecode(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='=';
  return decodeURIComponent(escape(atob(s)));
}
function fmt(n){return Number(n).toLocaleString("es-AR",{maximumFractionDigits:0});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function render(){
  const cont=document.getElementById('cont');
  const hash=location.hash.slice(1);
  if(!hash){cont.innerHTML='<div class="err"><b>Link sin datos</b><p>Este link no trae ningún pedido. Abrí el link completo que llegó por WhatsApp.</p></div>';return;}
  let ped;
  try{ ped=JSON.parse(b64urlDecode(hash)); }
  catch(e){ cont.innerHTML='<div class="err"><b>No se pudo leer el pedido</b><p>El link parece incompleto o dañado. Copiá y pegá el link entero desde WhatsApp.</p></div>'; return; }

  const fecha=new Date(ped.fecha||Date.now()).toLocaleString("es-AR");
  let rows='';
  (ped.items||[]).forEach(i=>{
    rows+=`<tr><td>${esc(i.d)}</td><td class="q">${i.q}</td><td class="u">$${fmt(i.u)}</td><td class="t">$${fmt(i.t)}</td></tr>`;
  });
  cont.innerHTML=`
    <div class="card">
      <div class="top"><div class="num">${esc(ped.numero||'Pedido')}</div><div class="meta">${fecha}</div></div>
      <div class="body">
        ${ped.cliente?`<div class="cli">Cliente: <b>${esc(ped.cliente)}</b></div>`:''}
        ${ped.nota?`<div class="nota">Nota: ${esc(ped.nota)}</div>`:''}
        <table><thead><tr><th>Producto</th><th class="q">Cant.</th><th class="u">Unit.</th><th class="t">Total</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="tot"><span class="k">Total</span><span class="v">$${fmt(ped.total||0)}</span></div>
        <button class="dl" id="dl"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Descargar JSON para la PC</button>
        <div class="hint">Se baja un archivo <b>.json</b> con el formato que importa tu programa de la PC (como preventa).</div>
      </div>
    </div>`;

  document.getElementById('dl').onclick=()=>{
    const payload={
      tipo:'PEDIDO_TABLET_AREA51',
      exportadoEl:new Date().toISOString(),
      pedido:{
        numero:ped.numero||'',
        fecha:ped.fecha||new Date().toISOString(),
        cliente:ped.cliente||'',
        total:ped.total||0,
        items:(ped.items||[]).map(i=>({c:i.c,d:i.d,q:i.q,u:i.u,t:i.t}))
      }
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const cli=(ped.cliente||'sin-cliente').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,24);
    a.download=`${ped.numero||'pedido'}-${cli}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
}
window.addEventListener('hashchange',render);
render();
</script>
